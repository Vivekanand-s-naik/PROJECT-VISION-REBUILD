[project]
name = "projectvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivekanand-s-naik", email = "vivekanadsnaik.iet@srinivasuniversity.edu.in" }
]
requires-python = ">=3.11"
dependencies = [
    "dlib-bin>=20.0.1",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "firebase>=4.0.1",
    "firebase-admin>=6.0.0",
    "flask>=2.3.0",
    "h5py>=3.10.0",
    "matplotlib>=3.5.0",
    "mediapipe==0.10.7",
    "numpy>=1.24.0,<2.5.0",
    "opencv-contrib-python>=4.10.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "setuptools<70",
    "speechrecognition>=3.10.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
]

[project.scripts]
projectvision = "projectvision:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "dlib; extra == 'never'",
]

