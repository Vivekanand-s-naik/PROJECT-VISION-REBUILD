[project]
name = "projectvision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivekanand-s-naik", email = "vivekanadsnaik.iet@srinivasuniversity.edu.in" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "chromadb>=1.5.9",
    "dlib-bin>=20.0.1",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.163.1",
    "firebase>=4.0.1",
    "firebase-admin>=6.0.0",
    "flask>=2.3.0",
    "h5py>=3.10.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.22",
    "langgraph-checkpoint>=4.3.2",
    "langsmith>=0.14.17",
    "matplotlib>=3.5.0",
    "mcp>=2.3.0",
    "mediapipe==0.10.7",
    "numpy>=1.24.0,<2.0.0",
    "opencv-contrib-python>=4.10.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "psycopg2>=2.9.13",
    "pymupdf>=2.1",
    "pypdf>=7.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.33",
    "requests>=2.28.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "setuptools<70",
    "speechrecognition>=3.10.0",
    "torch>=2.0.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.15.0",
    "transformers>=5.23.0",
    "ultralytics>=8.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
projectvision = "projectvision:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
]
override-dependencies = [
    "dlib; extra == 'never'",
]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
